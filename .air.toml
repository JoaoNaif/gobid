root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./bin/api.exe ./cmd/api"
  bin = "./bin/api.exe"
  include_ext = ["go", "tpl", "tmpl", "html"]
  exclude_dir = ["bin", "tmp", "vendor"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  delay = 1000
  stop_on_error = true

[log]
  time = false

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
